name: CI

on: [push, pull_request]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Validate
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright@sha256:bc4fbb329a25287ed23e9216c97063646abdd1bf2da669a9895fa3e2078b2302 # v1.65.0-noble, linux/amd64
      options: --ipc=host
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies and build library (prepare)
        run: npm ci
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      # npm ci runs prepare, which builds all published library formats.
      - run: npm run size
      - run: npm run build-storybook -- --disable-telemetry
      - run: npm run test:browser
      - run: npm run test:package -- --browser
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always()
        with:
          name: browser-results
          path: |
            test-results
            playwright-report
          retention-days: 7
